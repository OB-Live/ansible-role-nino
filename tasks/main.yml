---

- name: "Init logs"
  ansible.builtin.shell: |
    echo "============ NĬNO Exec Log ============ " > exec.log
    echo "=                                     = " >> exec.log
    echo "==== from {{ source_db }} " >> exec.log
    echo "====== to {{ target_db }} " >> exec.log
    echo "====== at $(date '+%d/%m/%Y %H:%M:%S')  " >> exec.log
    echo "=                                     = " >> exec.log
  args:
    executable: /bin/bash
  changed_when: false

- name: Connect to source and target databases
  ansible.builtin.include_tasks: connect.yml

- name: Truncate target tables if configured
  ansible.builtin.include_tasks: truncate.yml
  loop: "{{ entities }}"
  vars:
    id_name: "{{ item.name }}"

- name: Iterate over entities
  ansible.builtin.include_tasks: pipeline.yml
  loop: "{{ entities }}"
  vars:
    id_name: "{{ item.name }}"
    id_json: "{{ item.id_json }}"
    id_mask: "{{ item.id_mask if item.id_mask is defined else '' }}"
    yaml_mask: "{{ item.yaml_mask if item.yaml_mask is defined else '' }}"

- name: "LINO check target : {{ item.name }}"
  ansible.builtin.shell: |
    echo "$ lino pull target -i {{ descriptor }} " >> exec.log
    lino pull target -i {{ descriptor }} >> exec.log
  args:
    executable: /bin/bash
  changed_when: false
  vars:
    descriptor: "{{ workspace }}/target/{{ item.name }}-descriptor.yml"
  loop: "{{ entities }}"

# Post processing
- name: Compare source and target files for differences
  ansible.builtin.include_tasks: diff.yml

